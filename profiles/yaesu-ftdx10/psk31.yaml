schema: openrms-rigs/profile/v1
title: FT-DX10 PSK31 with fldigi
summary: 'PSK31 through the USB codec in DATA-U. Clean audio matters more than power: zero ALC.'
rig:
  macro: RIG_MODEL_FTDX10
  hamlib_model: 1042
  mfg: Yaesu
  name: FTDX-10
operation: psk
connection: usb
interface: built-in USB codec
hamlib: '>=4.6'
audio:
  rx_note: Band noise around -50 dB on fldigi's level meter, with signal peaks inside the grey lines.
  tx_note: 'Zero ALC: back off from the first ALC flicker. PSK is not a constant-envelope mode, so any
    ALC action splatters.'
steps:
- id: mode
  kind: mode
  name: MODE
  value: PKTUSB
  passband_hz: 3000
  note: DATA-U, not the radio's own PSK mode (that's its built-in decoder).
  sources:
  - S1
  - S7
  confidence: medium
- id: agc
  kind: level
  name: AGC
  menu:
  - Touch panel
  - AGC
  value: 6
  expect:
    not:
    - 0
  display: AUTO
  note: AUTO (picks MID in DATA-U). AGC OFF clipped the USB receive audio in two independent tests. The
    WSJT-X guide's general advice to run AGC off doesn't suit this radio.
  sources:
  - S1
  - S5
  - S9
  confidence: medium
- id: nb-off
  kind: func
  name: NB
  menu:
  - Front panel
  - NB key
  value: false
  sources:
  - S1
  - S3
  confidence: medium
- id: nr-off
  kind: func
  name: NR
  menu:
  - Front panel
  - DNR key
  value: false
  note: DNR off.
  sources:
  - S1
  - S3
  confidence: medium
- id: anf-off
  kind: func
  name: ANF
  menu:
  - FUNC knob
  - DNF
  value: false
  note: DNF off.
  sources:
  - S1
  - S3
  confidence: medium
- id: notch-off
  kind: func
  name: MN
  menu:
  - Front panel
  - NOTCH key
  value: false
  sources:
  - S1
  - S3
  confidence: medium
- id: apf-off
  kind: func
  name: APF
  menu:
  - Front panel
  - CONT/APF key
  value: false
  note: CONTOUR/APF off.
  sources:
  - S1
  - S3
  confidence: medium
- id: comp-off
  kind: func
  name: COMP
  menu:
  - FUNC knob
  - PROC LEVEL (fully left = OFF)
  value: false
  safety: tx
  sources:
  - S1
  - S7
  confidence: medium
- id: power
  kind: level
  name: RFPOWER
  menu:
  - FUNC knob
  - RF POWER
  value: 0.5
  unit: fraction
  display: ~50 W
  safety: tx
  note: Digital modes run at a high duty cycle; derate to what your station sustains.
  sources:
  - S1
  confidence: low
- id: data-mod-source
  kind: cat
  name: DATA MOD SOURCE
  menu:
  - RADIO SETTING
  - MODE PSK/DATA
  - DATA MOD SOURCE
  value: 1
  safety: tx
  cat:
    protocol: ascii
    read: EX010415;
    reply: ^EX010415(\d);$
    set: EX010415{value};
    values:
      '0': MIC
      '1': REAR
  note: RADIO SETTING > MODE PSK/DATA > DATA MOD SOURCE = REAR (the rear/USB audio path, not the mic).
  sources:
  - S1
  - S2
  - S3
  - S4
  - S9
  confidence: high
- id: rear-select
  kind: cat
  name: REAR SELECT
  menu:
  - RADIO SETTING
  - MODE PSK/DATA
  - REAR SELECT
  value: 1
  safety: tx
  cat:
    protocol: ascii
    read: EX010416;
    reply: ^EX010416(\d);$
    set: EX010416{value};
    values:
      '0': DATA
      '1': USB
  note: RADIO SETTING > MODE PSK/DATA > REAR SELECT = USB. The factory default is DATA (the rear jack),
    so this must change. EX010416 was read back on a real FT-DX10 (reply EX0104161; on a station running
    USB audio) [S9].
  sources:
  - S1
  - S2
  - S3
  - S4
  - S9
  confidence: high
- id: rport-gain
  kind: cat
  name: RPORT GAIN
  menu:
  - RADIO SETTING
  - MODE PSK/DATA
  - RPORT GAIN
  value: 50
  expect:
    min: 30
    max: 70
  safety: tx
  cat:
    protocol: ascii
    read: EX010417;
    reply: ^EX010417(\d{3});$
    set: EX010417{value:03};
  note: Transmit audio gain for the rear input that REAR SELECT picks, including USB (the FT-DX10 has
    no separate USB MOD GAIN; that's an FTDX101 item). Both USB setup guides tune it. Use 30–70 and keep
    the computer's output level modest. VE3SMA traced harmonics and wrong-sideband output to a low gain
    (the PRESET's 10) with the PC turned up. EX010417 was read back on a real FT-DX10; that test station
    runs 005, below this range [S9].
  sources:
  - S1
  - S2
  - S3
  - S4
  - S9
  confidence: medium
- id: data-shift
  kind: cat
  name: DATA SHIFT (SSB)
  menu:
  - RADIO SETTING
  - MODE PSK/DATA
  - DATA SHIFT (SSB)
  value: 1500
  cat:
    protocol: ascii
    read: EX010408;
    reply: ^EX010408(\d{4});$
    set: EX010408{value:04};
  note: Centre of the audio passband, 0000–3000 Hz. 1500 is the factory default.
  sources:
  - S1
  - S2
  - S3
  - S4
  - S9
  confidence: high
- id: data-out-level
  kind: cat
  name: DATA OUT LEVEL
  menu:
  - RADIO SETTING
  - MODE PSK/DATA
  - DATA OUT LEVEL
  check_only: true
  cat:
    protocol: ascii
    read: EX010413;
    reply: ^EX010413(\d{3});$
    set: EX010413{value:03};
  note: Check only. Yaesu's manual describes this as the rear RTTY/DATA jack level, not USB audio; sources
    run it at 0 or 50. The codes are confirmed; the effect on USB audio is not.
  sources:
  - S1
  - S2
  - S3
  - S9
  confidence: low
- id: width
  kind: manual
  name: Receive width
  manual:
    menu: WIDTH (and R.FIL 3 kHz)
    value: 3000 Hz
  note: So the whole 0–3 kHz audio window reaches the computer.
  sources:
  - S3
  - S4
  confidence: medium
- id: cat-rate
  kind: manual
  name: CAT RATE
  manual:
    menu: OPERATION SETTING > GENERAL > CAT RATE
    value: 38400 bps
  note: Change this on the radio, not over CAT (the link drops when the rate changes). Match it in your
    software.
  sources:
  - S3
  - S4
  confidence: high
software:
- app: fldigi
  setting: Rig control
  value: Hamlib 'Yaesu FTDX-10' (or flrig), 38400 baud, PTT via CAT
- app: fldigi
  setting: Audio devices
  value: USB AUDIO CODEC (the radio), capture and playback
notes: |-
  Researched from Yaesu's FT-DX10 manuals, setup guides by VE3SMA, VE3SP and M0AWS, and on-air testing with hamstack. Not every value has been confirmed on air by an openRMS user: the step confidence and sources show what each one rests on. Yaesu menu numbers differ between models and firmware; these EX numbers are for the FT-DX10. The menu item names come from the FT-DX10 manual (RPORT GAIN, LCUT/HCUT FREQ); "USB MOD GAIN" is an FTDX101 name.

  Don't use the radio's PSK mode with sound-card software [S2]. No FT-DX10-specific source covers this mode, so the radio settings are carried over from the FT8 sources, and the levels come from the fldigi manual [S7].
tags:
- researched
- unverified
