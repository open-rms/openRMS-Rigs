  author: Yaesu Musen
  url: https://www.yaesu.com/Files/4CB893D7-1018-01AF-FA97E9E9AD48B50C/FTDX10_CAT_OM_ENG_2308-F.pdf
  date: 2023-08
  note: Menu chart gives the EX numbers and CAT ranges.
- id: S3
  title: List of FTDX10 Settings for FT8/FT4/MSK144 (and FTDX10 Issues and Solutions)
  author: Steve Kavanagh VE3SMA
  url: https://www.qsl.net/ve3sma/FTDX10%20FT8%20Settings%20Jan%202%202022v0.3.pdf
