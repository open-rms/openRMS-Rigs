# Shared source list for the FT-991/991A profiles (each profile copies the ones it cites).
- {id: S1, title: FT-991 Operating Manual, author: Yaesu Musen, url: 'https://www.rigpix.com/yaesu/ft991_manual.pdf', date: 2015-07, note: 'Mirror copy. USB data setup pp. 118-119, menu table pp. 121-123, item descriptions pp. 124-136 (033 on p. 127, 062-073 on pp. 130-131).'}
- {id: S2, title: FT-991A Operating Manual, author: Yaesu Musen, url: 'https://www.rcqsl.com/manuals/52.pdf', date: '2021', note: Mirror copy. Menu items 001-087 match the FT-991; 088-153 are renumbered. USB data setup p. 123; names DT-G (DT GAIN).}
- {id: S3, title: FT-991 CAT Operation Reference Book, author: Yaesu Musen, url: 'https://www.rigpix.com/yaesu/ft991_cat_manual.pdf', date: 2015-01, note: 'EX command format p. 7; menu parameter table pp. 7-9 (151 items; 031-033 on p. 7, 062-073 on p. 8).'}
- {id: S4, title: FT-991A CAT Operation Reference Book, author: Yaesu Musen, url: 'https://rigpix.com/yaesu/ft991a_cat_manual.pdf', date: 2017-11, note: 'EX command format p. 7; menu parameter table pp. 7-9 (153 items; 031-033 on p. 7, 062-073 on p. 8).'}
- {id: S5, title: 'fldigi wiki: FT991A howto', author: fldigi project wiki (W1HKJ and contributors), url: 'https://www.sourceforge.net/p/fldigi/wiki/FT991A_howto'}
- {id: S6, title: FT-991A setup using the internal sound card (Winlink/WINMOR), author: 'N1RWY, adapted for the FT-991A (hosted by Winlink)', url: 'https://winlink.org/sites/default/files/RMSE_FORMS/ft-991a-setup.pdf', note: WINMOR era; the radio-side menu and DT GAIN advice still applies.}
