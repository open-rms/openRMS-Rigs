- {id: S8, title: 'Pat wiki: Rig control', author: Martin Hebnes Pedersen LA5NTA and Pat contributors, url: 'https://github.com/la5nta/pat/wiki/Rig-control'}
- {id: S9, title: FT-991A USB Configuration, author: HRD Software support, url: 'https://support.hamradiodeluxe.com/support/solutions/articles/51000054685-ft-991a-usb-configuration'}
- {id: S10, title: 'Getting started with FreeDV: Yaesu (FT-991A section)', author: FreeDV project; FT-991A settings from Geoff VK3GTP, url: 'https://freedv.org/getting-started-yaesu/'}
- {id: S11, title: 'The Standard COM Port: what is that and its use', author: PY2RAF (rfrht/FT-991A wiki), url: 'https://github.com/rfrht/FT-991A/wiki/The-Standard-COM-Port---what-is-that-and-its-use', date: 2022-10}
