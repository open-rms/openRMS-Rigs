- id: S3
  title: IC-7610 Version 1.30 information sheet
  author: Icom Inc.
  url: https://icomfrance.com/uploads/files/produit/not-IC-7610_ENG_Info_V130_0a-en.pdf
  date: 2021-04
- id: S5
  title: IC-7610 User Evaluation & Test Report (issue 8)
  author: Adam Farson VA7OJ/AB4OJ
  url: https://www.qsl.net/ab4oj/icom/ic7610/7610notes.pdf
  date: 2020-11
- id: S6
  title: 'Sherwood Engineering test results: Icom IC-7610'
  author: Rob Sherwood NC0B
  url: https://www.qsl.net/ab4oj/icom/ic7610/icom_ic7610_h.pdf
  date: 2017-12
