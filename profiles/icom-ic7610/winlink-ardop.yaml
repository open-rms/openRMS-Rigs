schema: openrms-rigs/profile/v1
title: IC-7610 Winlink over ARDOP (Winlink Express or Pat)
summary: Winlink over ARDOP through the IC-7610's USB codec. W0KAH needed only 11% USB MOD Level for no ALC.
rig:
  macro: RIG_MODEL_IC7610
  hamlib_model: 3078
  mfg: Icom
  name: IC-7610
  firmware: '>=1.30'
operation: winlink-ardop
connection: usb
interface: built-in USB codec (rear [USB 1] port)
hamlib: '>=4.6'
audio:
  tx_note: Little or no ALC (Winlink guidance as quoted by VA3QT). Run the TNC's transmit level test and
    reduce USB MOD Level until ALC doesn't move.
steps:
- id: mode
  kind: mode
  name: MODE
  value: PKTUSB
  passband_hz: 3000
  note: USB-D. Winlink Express selects USB-D1 itself (W0KAH). When Hamlib sets PKTUSB it sends data mode 01
    (CI-V 1A 06), which is DATA1, so the radio lands in USB-D1.
  sources:
  - S1
  - S4
  - S9
  - S10
  - S13
  confidence: high
- id: fil1
  kind: manual
  name: Filter FIL1 (USB-D)
  manual:
    menu: FILTER (hold 1 s) > FIL1 > BW, then MAIN DIAL
    value: 3.0 kHz (data mode default is 1.2 kHz)
  note: Data mode switches the receiver to the CW filter set (FIL1/2/3 = 1.2 kHz / 500 / 250 Hz), so widen
    FIL1 before decoding a whole sub-band. FB News uses 3.0 kHz; VA7ST uses 3.6 kHz, the maximum.
  sources:
  - S1
  - S8
  - S9
  confidence: high
- id: agc-not-off
  kind: level
  name: AGC_TIME
  menu:
  - Multi-function key group
  - AGC (hold 1 s) > AGC screen
  check_only: true
  expect:
    not:
    - 0
  unit: s
  display: not OFF
  note: "Checked, not set: warns if the selected AGC preset's time constant is OFF (0). Farson advises
    against AGC OFF on this direct-sampling radio (it invites ADC overload). The Nittany ARC station runs
    AGC OFF for digital, and the WSJT-X guide suggests AGC off or reduced RF gain. Keep it on (FAST or
    MID) unless you watch OVF."
  sources:
  - S1
  - S4
  - S5
  - S12
  - S13
  - S14
  confidence: medium
- id: nb-off
  kind: func
  name: NB
  menu:
  - Front panel
  - NB key
  value: false
  sources:
  - S9
  - S12
  confidence: medium
- id: nr-off
  kind: func
  name: NR
  menu:
  - Front panel
  - NR key
  value: false
  sources:
  - S9
  - S12
  confidence: medium
- id: usb-af
  kind: manual
  name: USB AF Output Level
  manual:
    menu: MENU » SET > Connectors > USB AF/IF Output > AF Output Level
    value: 50% (default), then adjust to the TNC's receive meter
  note: "Receive audio to the computer through [USB 1]. No ARDOP-specific value; W0KAH used 75% for VARA.
    Kept as a menu step: Hamlib 4.7 doesn't expose USB_AF for the IC-7610."
  sources:
  - S1
  - S10
  confidence: low
- id: usb-output-select
  kind: manual
  name: USB Output Select
  manual:
    menu: MENU » SET > Connectors > USB AF/IF Output > Output Select
    value: AF (default)
  note: 'IF sends a 12 kHz IF (Farson: for DRM decoders) instead of audio.'
  sources:
  - S1
  - S4
  - S5
  confidence: high
- id: usb-af-sql
  kind: manual
  name: USB AF SQL
  manual:
    menu: MENU » SET > Connectors > USB AF/IF Output > AF SQL
    value: OFF (Open, default)
  note: With squelch on, the decoder hears nothing between signals.
  sources:
  - S1
  - S4
  confidence: high
- id: usb-af-beep
  kind: manual
  name: USB AF Beep/Speech Output
  manual:
    menu: MENU » SET > Connectors > USB AF/IF Output > AF Beep/Speech... Output
    value: OFF (default)
  note: Keeps beeps and voice announcements out of the decoder's audio.
  sources:
  - S1
  - S4
  confidence: high
- id: usb-mod
  kind: manual
  name: USB MOD Level
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > USB MOD Level
    value: 11% (W0KAH), then adjust with the ARDOP transmit level test
  note: "W0KAH ran the TNC's Transmit Level Test and lowered USB MOD Level until ALC stopped moving: 11% on
    his radio. Default 50%."
  sources:
  - S1
  - S10
  confidence: low
- id: data-off-mod
  kind: manual
  name: DATA OFF MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > DATA OFF MOD
    value: MIC,ACC (default)
  note: Keeps the mic working in voice modes. With ACC, USB or LAN here, Voice TX memories can't be sent.
  sources:
  - S1
  - S2
  - S7
  - S10
  confidence: high
- id: data1-mod
  kind: manual
  name: DATA1 MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > DATA1 MOD
    value: USB (default is ACC)
  note: "Required: Hamlib and Winlink Express put the radio in USB-D1, and with the ACC default the
    computer's transmit audio goes nowhere. HRD also sets DATA1 to USB. Leave it on ACC only if D1 drives
    an ACC device (W0KAH's Pactor modem) and you select USB-D2 yourself."
  sources:
  - S1
  - S7
  - S10
  - S13
  confidence: high
- id: data2-mod
  kind: manual
  name: DATA2 MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > DATA2 MOD
    value: USB (default)
  note: For software or operators that use USB-D2 (FB News, Nittany ARC, OmniRig setups).
  sources:
  - S1
  - S7
  - S8
  - S10
  - S12
  confidence: high
- id: usb-send
  kind: manual
  name: USB SEND / USB Keying (CW) / USB Keying (RTTY)
  manual:
    menu: MENU » SET > Connectors > USB SEND/Keying
    value: OFF, OFF, OFF (defaults)
  note: Icom's defaults, with PTT over CAT as the Nittany ARC runs it. HRD and K3CT do assign DTR/RTS lines
    here, for CW and FSK keying from loggers; this profile doesn't need them. Icom warns a short SEND or
    keying signal can occur when a USB cable is connected.
  sources:
  - S1
  - S2
  - S12
  confidence: medium
- id: civ-port
  kind: manual
  name: CI-V USB Port
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V USB Port
    value: Unlink from [REMOTE] (default)
  note: The CI-V USB baud and echo settings only apply when unlinked. FB News (2017) used Link with 19200 bps.
  sources:
  - S1
  - S7
  - S10
  - S11
  confidence: high
- id: civ-baud
  kind: manual
  name: CI-V USB Baud Rate
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V USB Baud Rate
    value: 115200 (default Auto); set the software to the same fixed rate
  note: Nittany ARC runs 38400; Auto follows whatever the software uses.
  sources:
  - S1
  - S7
  - S10
  - S11
  confidence: high
- id: civ-address
  kind: manual
  name: CI-V Address
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V Address
    value: 98h (default)
  sources:
  - S1
  - S7
  - S8
  - S12
  confidence: high
- id: civ-transceive
  kind: manual
  name: CI-V Transceive
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V Transceive
    value: OFF (default ON)
  note: Stops unsolicited frequency and mode reports on the bus. HRD and K3CT both turn it off.
  sources:
  - S1
  - S7
  - S11
  confidence: medium
- id: civ-echo
  kind: manual
  name: CI-V USB Echo Back
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V USB Echo Back
    value: OFF (default)
  note: "Sources disagree: HRD uses ON (as does VA3QT on his IC-7300), K3CT OFF (ON only for DX4Win).
    Hamlib 4.7 detects echo either way; match any software that asks (e.g. fldigi RigCat 'Commands are
    Echoed')."
  sources:
  - S1
  - S7
  - S10
  - S11
  - S13
  confidence: medium
software:
- app: pat
  setting: Rig
  value: rigctld -m 3078 (Hamlib IC-7610) on the radio's CI-V COM port
  note: Model number from the Hamlib catalog [S13]; W0KAH used Winlink Express and no IC-7610 Pat guide was
    found.
- app: ardop
  setting: Sound card
  value: USB Audio CODEC (the radio)
  note: '[S10]'
- app: ardop
  setting: Drive
  value: run the TNC's transmit level test, reduce drive until ALC doesn't move
  note: Procedure from W0KAH's notes [S10].
notes: |-
  Researched from Icom's IC-7610 manuals (2017 first editions), the V1.30 information sheet and CI-V reference, plus setup notes from Ham Radio Deluxe, FB News, VA7ST, VA3QT/W0KAH, K3CT and the Nittany ARC listed under Sources. Not yet confirmed on air by an openRMS user: check the step confidence. Written for firmware 1.30 or newer: by firmware 1.11 'Tone Control' had become 'Tone Control/TBW' with an SSB-D TBW (Farson), and 1.30 disables Tone Control in data mode [S5] [S3].

  One cable to the rear [USB 1] port carries CI-V and audio. The radio shows two virtual COM ports, USB1 (A) and USB1 (B) [S2]; K3CT uses A for CAT [S11]. Data mode also locks out the speech compressor [S1]. The IC-7610 has two receivers; the manuals read here don't say which codec channel carries which band, so check receive audio on the Left channel first. VA7ST found Windows defaulting the codec's output to Mono, which cut transmit power until he selected Left [S9].

  W0KAH found Winlink Express forcing USB-D1 at the narrowest filter when connecting over ARDOP, cancelling his manual switch to USB-D2 [S10]. With DATA1 MOD on USB, USB-D1 works; widen FIL1 again if the software narrows it. Leave VA3QT's [TUNER] Auto, PTT Start and VOX suggestions out: profiles never key the radio.
