schema: openrms-rigs/profile/v1
title: "IC-706MKII AM phone"
summary: "AM at up to 40 W carrier, slow AGC and the standard 8 kHz filter, from Icom's manual."
rig:
  macro: RIG_MODEL_IC706MKII
  hamlib_model: 3010
  mfg: Icom
  name: IC-706MkII
operation: am
connection: serial
interface: stock HM-103 hand mic; CAT (optional, for the mode step) over a CI-V cable
hamlib: '>=4.6'
audio:
  tx_note: "Mic gain from the default 5; watch the ALC meter (M3 > MET) and keep peaks within the zone."
steps:
- id: mode
  kind: mode
  name: MODE
  value: AM
  passband_hz: 0
  menu:
  - MODE
  sources:
  - S1
  - S2
  confidence: high
- id: rf-power
  kind: manual
  name: RF power (carrier)
  safety: tx
  manual:
    menu: Quick set (hold DISPLAY 2 s) > Q1 RF POWER
    value: Up to 40 W carrier on HF/50 MHz (range 4–40 W; 2–8 W on 144 MHz)
  note: In AM the maximum is carrier power, 40 W on HF and 6 m.
  sources:
  - S1
  confidence: high
- id: mic-gain
  kind: manual
  name: Mic gain
  safety: tx
  manual:
    menu: Quick set > Q2 MIC GAIN
    value: 5 (default), adjust so ALC doesn't peak past its zone
  sources:
  - S1
  confidence: medium
- id: agc
  kind: manual
  name: AGC time constant
  manual:
    menu: MENU > M4 > [F-3] AGC
    value: SLOW
  note: Icom recommends slow AGC for phone.
  sources:
  - S1
  confidence: high
- id: filter
  kind: manual
  name: IF filter
  manual:
    menu: MENU > M3 > [F-1] FIL
    value: Normal (FL-94, 8 kHz); narrow uses the FL-272 2.4 kHz
  sources:
  - S1
  confidence: high
- id: am-nb
  kind: manual
  name: AM noise blanker availability
  manual:
    menu: Initial set mode (hold LOCK at power-on) > 22 AM NB
    value: ON (default) for AM contacts; OFF for broadcast listening
  note: Icom says the blanker can degrade strong AM broadcast audio. KV5R turns it off on the MKIIG.
  sources:
  - S1
  - S6
  confidence: high
- id: rf-sql
  kind: manual
  name: RF/SQL control
  manual:
    menu: Front panel [RF/SQL] knob
    value: Squelch open (in AM it is always squelch)
  sources:
  - S1
  confidence: high
notes: |-
  From Icom's IC-706MKII manual, with KV5R's MKIIG note on the AM noise blanker. Not yet confirmed on air by an openRMS user.

  Icom describes the speech compressor for SSB, though its menu guide also lists COM in the AM row of M4 [S1].

  MKIIG owners differ: different initial set numbers (KV5R's AM NB is item 24 on the MKIIG) [S6].
tags:
- researched
- unverified
sources:
- id: S1
  title: IC-706MKII Instruction Manual (A-5436H-1EX)
  author: Icom Inc.
  url: https://www.manualslib.com/manual/542581/Icom-Ic-706mkii.html
  date: '1997'
  note: 'Read on ManualsLib: ACC socket p.6, receive/transmit pp.21-26, CW p.32, RTTY p.34, set mode pp.43-48, menu guide p.60.'
- id: S2
  title: 'Hamlib 4.7.2 capabilities: IC-706MkII (model 3010) and IC-706MkIIG (model 3011)'
  author: Hamlib project
  url: https://github.com/Hamlib/Hamlib/blob/Hamlib-4.7/rigs/icom/ic706.c
  note: 'rigctl --dump-caps: PTT type None, serial 300..19200 baud, no settable functions or levels on the MKII; the MKIIG adds NB, COMP, PREAMP, ATT.'
- id: S6
  title: '706: New Setup'
  author: Harold Melton KV5R
  url: https://kv5r.com/ham-radio/icom-706mkiig/706-new-setup/
  date: 2015-04
  note: Written for the IC-706MkIIG (sibling model); used only for practice that carries over to the MKII.
