- { id: S5, title: "Icom IC-706 Digirig cable set (13-pin ACC audio/PTT and CI-V cords)", author: "Digirig", url: "https://digirig.net/product/icom-ic-706-cords-for-digirig-mobile/" }
- { id: S6, title: "706: New Setup", author: "Harold Melton KV5R", url: "https://kv5r.com/ham-radio/icom-706mkiig/706-new-setup/", date: "2015-04", note: "Written for the IC-706MkIIG (sibling model); used only for practice that carries over to the MKII." }
- { id: S7, title: "706: Computer Control and Soundcard Interface", author: "Harold Melton KV5R", url: "https://kv5r.com/ham-radio/icom-706mkiig/706-computer-control-and-soundcard-interface", date: "2005-06", note: "Written for the IC-706MkIIG (sibling model); the ACC pins it uses match the MKII manual." }
- { id: S8, title: "Getting Started on RTTY: Transmitting RTTY and AFSK with MMTTY (pages 5 and 6)", author: "AA5AU (aa5au.com)", url: "https://www.aa5au.com/rtty/page-06/" }
- { id: S9, title: "WSJT-X User Guide 2.7.0", author: "Joe Taylor K1JT and the WSJT development group", url: "https://wsjt.sourceforge.io/wsjtx-doc/wsjtx-main-2.7.0.html" }
