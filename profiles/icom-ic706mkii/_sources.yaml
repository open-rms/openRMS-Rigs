# Shared source list for the IC-706MKII profiles (each profile copies the ones it cites).
- { id: S1, title: "IC-706MKII Instruction Manual (A-5436H-1EX)", author: "Icom Inc.", url: "https://www.manualslib.com/manual/542581/Icom-Ic-706mkii.html", date: "1997", note: "Read on ManualsLib: ACC socket p.6, receive/transmit pp.21-26, CW p.32, RTTY p.34, set mode pp.43-48, menu guide p.60." }
- { id: S2, title: "Hamlib 4.7.2 capabilities: IC-706MkII (model 3010) and IC-706MkIIG (model 3011)", author: "Hamlib project", url: "https://github.com/Hamlib/Hamlib/blob/Hamlib-4.7/rigs/icom/ic706.c", note: "rigctl --dump-caps: PTT type None, serial 300..19200 baud, no settable functions or levels on the MKII; the MKIIG adds NB, COMP, PREAMP, ATT." }
- { id: S3, title: "Equipment Review: Icom IC-706MkII (Amateur Radio magazine)", author: "Ron Fisher VK3OM", url: "https://radiomanual.info/schemi/ICOM_HF/IC-706Mk2_review_1998.pdf", date: "1998-10" }
