schema: openrms-rigs/profile/v1
title: "IC-706MKII PSK31 through an ACC-port sound interface"
summary: "USB mode with a soundcard interface on the ACC socket; drive set for no ALC, hardware PTT."
rig:
  macro: RIG_MODEL_IC706MKII
  hamlib_model: 3010
  mfg: Icom
  name: IC-706MkII
operation: psk
connection: serial
interface: external sound interface on the 13-pin ACC socket (e.g. SignaLink USB, Digirig) plus a CI-V cable
hamlib: '>=4.6'
audio:
  rx_note: 'ACC pin 12 gives a fixed 100–350 mV receive level whatever the AF knob says, so set the receive level on the interface or the computer input.'
  tx_note: "PSK31 needs a clean linear signal: set drive on the interface and in the software so the ALC meter (M3 > MET) shows no ALC; KV5R and AA5AU agree there should be none on digital modes."
steps:
- id: mode
  kind: mode
  name: MODE
  value: USB
  passband_hz: 0
  menu:
  - MODE
  note: USB by convention (PSK31 itself doesn't care about sideband). KV5R runs soundcard modes in SSB and reports fldigi working in USB. The MKII has no data mode.
  sources:
  - S1
  - S2
  - S6
  - S7
  confidence: medium
- id: agc
  kind: manual
  name: AGC time constant
  manual:
    menu: MENU > M4 > [F-3] AGC
    value: FAST ('FAGC' shown)
  note: Icom suggests fast AGC for receiving data. The MKII has only FAST and SLOW, no AGC OFF; RF gain (below) can reduce AGC action further.
  sources:
  - S1
  confidence: medium
- id: rf-sql
  kind: manual
  name: RF/SQL control
  manual:
    menu: Front panel [RF/SQL] knob
    value: Squelch fully open (anticlockwise)
  note: With the default initial set item 21 RF GAIN = OFF, this knob is only a squelch. To use it as RF gain in USB, set item 21 to ON; Icom's normal RF gain position is 10 o'clock.
  sources:
  - S1
  confidence: medium
- id: nb-off
  kind: manual
  name: Noise blanker
  manual:
    menu: MENU > M3 > [F-2] NB
    value: 'OFF'
  note: The blanker is for pulse-type noise; leave it off unless you have that.
  sources:
  - S1
  confidence: low
- id: filter
  kind: manual
  name: IF filter
  manual:
    menu: MENU > M3 > [F-1] FIL
    value: Normal (FL-272, 2.4 kHz) to watch the waterfall; narrow if fitted
  note: 'The narrow CW filters (FL-100 500 Hz, FL-101 250 Hz, FL-232 350 Hz) are only selectable in CW and RTTY mode. KV5R''s trick on the MKIIG: fit the FL-232 and declare it as an FL-223 so it becomes the narrow SSB filter for PSK31. Untested on a MKII, whose filter list is the same.'
  sources:
  - S1
  - S3
  - S6
  confidence: low
- id: comp-off
  kind: manual
  name: Speech compressor
  safety: tx
  manual:
    menu: MENU > M4 > [F-2] COM
    value: 'OFF'
  note: Compression on a data signal adds distortion; AA5AU turns the processor off for AFSK.
  sources:
  - S8
  confidence: medium
- id: vox-off
  kind: manual
  name: Radio VOX
  safety: tx
  manual:
    menu: MENU > M4 > [F-1] VOX
    value: 'OFF'
  note: PTT comes from the interface on ACC pin 3 (HSEND); the radio's own VOX would key on any audio. A SignaLink's VOX is the interface's, not this one.
  sources:
  - S1
  - S7
  confidence: medium
- id: rf-power
  kind: manual
  name: RF power
  safety: tx
  manual:
    menu: Quick set (hold DISPLAY 2 s) > Q1 RF POWER
    value: H, with output set by audio drive (no ALC); check with a watt meter
  note: 'Range L, 1–9, H (5–100 W on HF/50 MHz, 2–20 W on 144 MHz). Sources disagree on how much: KV5R leaves Q1 at 100% and lowers the computer audio to get about 20–30 W with no ALC (MKIIG); AA5AU aims for near-full output with no ALC. No source gives a 706 duty-cycle rating. PSK31 transmits continuously while you send.'
  sources:
  - S1
  - S6
  - S8
  confidence: low
- id: opt-filters
  kind: manual
  name: Optional filter presets
  manual:
    menu: Initial set mode (hold LOCK at power-on) > 19 OPT. FIL 1 / 20 OPT. FIL 2
    value: The filter fitted in each slot, or no (default)
  note: An installed filter can't be selected until it is declared here.
  sources:
  - S1
  confidence: high
- id: civ-address
  kind: manual
  name: CI-V address
  manual:
    menu: Initial set mode > 25 CI-V ADDRES
    value: 4EH (default)
  sources:
  - S1
  confidence: high
- id: civ-baud
  kind: manual
  name: CI-V baud rate
  manual:
    menu: Initial set mode > 26 CI-V BAUD
    value: 19200 (default Auto); set the software to the same rate
  note: Hamlib's IC-706MkII driver runs 300–19200 baud. KV5R fixes 19200 on the MKIIG; Auto follows the controller.
  sources:
  - S1
  - S2
  - S6
  confidence: medium
- id: civ-transceive
  kind: manual
  name: CI-V transceive
  manual:
    menu: Initial set mode > 27 CI-V TRN
    value: ON (default)
  note: KV5R uses ON; a Digirig forum poster ran OFF on a MKIIG while chasing a PTT fault.
  sources:
  - S1
  - S6
  - S10
  confidence: medium
- id: civ-731
  kind: manual
  name: CI-V 731 mode
  manual:
    menu: Initial set mode > 28 CI-V 731
    value: OFF (default, 5-byte frequency data)
  note: ON only for transceive with an IC-735.
  sources:
  - S1
  - S6
  confidence: high
software:
- app: fldigi
  setting: Rig control
  value: Hamlib, Icom IC-706MkII, 19200 baud (same as the radio)
- app: fldigi
  setting: PTT
  value: RTS or DTR on the interface's serial port (Digirig), or the SignaLink's VOX
  note: The IC-706MkII can't be keyed over CI-V (Hamlib PTT type None) [S2] [S8].
notes: |-
  Researched from Icom's IC-706MKII manual and Hamlib's driver, with interface notes from Tigertronics and Digirig and practice from KV5R, AA5AU and others listed under Sources. No PSK31 write-up for the original MKII was found; the steps rest on the manual and practice from the MKIIG. Not yet confirmed on air by an openRMS user: check the step confidence.

  PSK31 transmits continuously while you send; see the RF power step.

  Hookup: the MKII has no USB port and no DATA socket. Audio and PTT go through the 13-pin ACC socket (pin 2 GND, pin 3 HSEND for HF/50 MHz PTT, pin 7 VSEND for 144 MHz, pin 11 MOD in, pin 12 AF out) and CAT through the 3.5 mm CI-V REMOTE jack [S1] [S7]. Tigertronics' SLCAB13I cable suits the SignaLink; for 2 m on a 706 or MKII, Tigertronics says to move its PTT jumper to its pin 4 position [S4]. Digirig's IC-706 cord set needs a Digirig Mobile rev 1.6 or later configured for CI-V [S5].

  NA4IT found voice audio poor while the interface cable stayed in the ACC socket (on a MKIIG), so expect to unplug or switch it for phone [S12].

  MKIIG owners differ: the MKIIG adds 70 cm, a 6-pin data socket, a VSEND select menu, more initial set items (so different numbers) and CI-V address 58h, and Hamlib can set its NB, COMP, preamp and attenuator. Don't copy MKIIG menu numbers to a MKII [S2] [S4] [S6] [S10] [S13]. On the MKII, DSP (notch and noise reduction) is the optional UT-106 unit [S3].
tags:
- researched
- unverified
