schema: openrms-rigs/profile/v1
title: IC-705 PSK31 with fldigi (USB-D AFSK)
summary: PSK31 through the USB codec in USB-D, with zero ALC. Thin IC-705-specific PSK sourcing; radio settings
  follow the manual and the FT8 setup.
rig:
  macro: RIG_MODEL_IC705
  hamlib_model: 3085
  mfg: Icom
  name: IC-705
  firmware: '>=1.20'
operation: psk
connection: usb
interface: built-in USB codec (micro-USB port)
hamlib: '>=4.6'
audio:
  tx_note: 'No ALC on PSK: back off from the first ALC movement.'
steps:
- id: mode
  kind: mode
  name: MODE
  value: PKTUSB
  passband_hz: 3000
  note: USB-D. The IC-705 has a single data mode (LSB-D/USB-D/AM-D/FM-D), and Hamlib's PKTUSB sends data mode
    01 with it, which selects USB-D. Icom lists PSK31 among the data-mode uses.
  sources:
  - S1
  - S9
  - S15
  confidence: high
- id: fil1
  kind: manual
  name: Filter FIL1 (USB-D)
  manual:
    menu: Filter icon (touch 1 s) > FIL1 > BW, then MAIN DIAL
    value: 3.0 kHz (SSB-D default); 3.6 kHz is the maximum
  note: SSB-D filters default to FIL1 3.0 kHz, FIL2 1.2 kHz, FIL3 500 Hz, so FIL1 already covers a sub-band.
    BotanicFields widens it to 3.6 kHz and sets WSJT-X's receive range to match.
  sources:
  - S1
  - S8
  confidence: high
- id: nb-off
  kind: func
  name: NB
  menu:
  - FUNCTION
  - NB
  value: false
  note: 'Off: Icom notes the noise blanker can distort received signals. No IC-705 source gives a digital-mode
    setting.'
  sources:
  - S1
  confidence: medium
- id: nr-off
  kind: func
  name: NR
  menu:
  - FUNCTION
  - NR
  value: false
  note: Off as a baseline (general digital-mode practice; S1 gives only the control).
  sources:
  - S1
  confidence: low
- id: max-tx-pwr
  kind: manual
  name: MAX TX PWR
  safety: tx
  manual:
    menu: FUNCTION > page 2 > MAX TX PWR
    value: 10 W on 13.8 V DC; 5 W is the ceiling on the battery pack
  note: Also kept per supply as Max TX Power (Battery Pack) and (DC 13.8 V) under MENU » SET > Function; 10
    W needs the external DC supply. With only the USB cable connected the battery still powers transmit, so
    a laptop's USB port doesn't lift the 5 W limit. Below about 0 °C battery protection drops output to 0.5
    W.
  sources:
  - S1
  - S4
  - S5
  confidence: high
- id: usb-af
  kind: manual
  name: USB AF Output Level
  manual:
    menu: MENU » SET > Connectors > USB AF/IF Output > AF Output Level
    value: 50% (default), then adjust to fldigi's waterfall
  note: 'Receive audio to the computer. No IC-705 source gives a PSK value. Kept as a menu step: the Hamlib
    4.7.2 catalog doesn''t list USB_AF for the IC-705.'
  sources:
  - S1
  confidence: medium
- id: usb-output-select
  kind: manual
  name: USB Output Select
  manual:
    menu: MENU » SET > Connectors > USB AF/IF Output > Output Select
    value: AF (default)
  note: IF sends a 12 kHz IF signal instead of audio.
  sources:
  - S1
  confidence: high
- id: usb-af-sql
  kind: manual
  name: USB AF SQL
  manual:
    menu: MENU » SET > Connectors > USB AF/IF Output > AF SQL
    value: OFF (Open, default)
  note: With squelch on, the decoder hears nothing between signals.
  sources:
  - S1
  confidence: high
- id: usb-af-beep
  kind: manual
  name: USB AF Beep/Speech Output
  manual:
    menu: MENU » SET > Connectors > USB AF/IF Output > AF Beep/Speech... Output
    value: OFF (default)
  note: Keeps beeps and voice announcements out of the decoder's audio.
  sources:
  - S1
  confidence: high
- id: usb-mod
  kind: manual
  name: USB MOD Level
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > USB MOD Level
    value: 50% (default) to start, then reduce until ALC doesn't move
  note: PSK needs a clean linear signal. Farson reached full power at the default with a 0 dB PC tone, so expect
    to turn the PC's output well down.
  sources:
  - S1
  - S4
  confidence: medium
- id: data-mod
  kind: manual
  name: DATA MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > DATA MOD
    value: USB (default)
  note: Makes USB audio the modulation source in USB-D. Unlike the IC-7610 there is only one DATA MOD item,
    and its default is already USB; check it hasn't been left on WLAN from a wireless setup (kappanhang and
    wfview need WLAN) or set to MIC. Farson's test conditions say 'DATA-1 MOD', which is not an IC-705 menu
    item; the manuals list only DATA MOD.
  sources:
  - S1
  - S4
  - S9
  - S14
  confidence: high
- id: data-off-mod
  kind: manual
  name: DATA OFF MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > DATA OFF MOD
    value: MIC,USB (default)
  note: The source for SSB, AM and FM with data mode off. With the default MIC,USB the computer's audio is
    also transmitted in plain USB/LSB, so pick MIC if PC sounds could reach the radio. USB or WLAN alone stops
    the mic and the Voice TX memories. Farson set USB here only for his lab tests.
  sources:
  - S1
  - S4
  confidence: medium
- id: usb-send
  kind: manual
  name: USB SEND / USB Keying (CW) / USB Keying (RTTY)
  manual:
    menu: MENU » SET > Connectors > USB SEND/Keying
    value: OFF, OFF, OFF (defaults)
  note: PTT goes over CI-V (Hamlib's IC-705 backend keys the radio by command), so no DTR/RTS line is needed.
    Icom warns that SEND or keying may not work for a few seconds after the USB cable is connected, and that
    a second transceiver plugged into the same PC can send a short SEND pulse.
  sources:
  - S1
  - S2
  - S15
  confidence: high
- id: civ-address
  kind: manual
  name: CI-V Address
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V Address
    value: A4h (default)
  note: Use A4h with software that lists the IC-705 (Hamlib model 3085, fldigi/flrig). QST and OH8STN set 94h
    or picked the IC-7300 entry because WSJT-X and Winlink Express didn't list the IC-705 then; if you change
    the address, set the same one in every program.
  sources:
  - S1
  - S5
  - S6
  - S7
  - S15
  confidence: high
- id: civ-transceive
  kind: manual
  name: CI-V Transceive
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V Transceive
    value: ON (default)
  note: Icom's default; no IC-705 source read here changes it. It sends a report on the bus whenever a setting
    changes on the radio.
  sources:
  - S1
  confidence: medium
- id: civ-echo
  kind: manual
  name: CI-V USB Echo Back
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V USB Echo Back
    value: OFF (default)
  note: The fldigi wiki says flrig's Echo box must match this item. Hamlib's IC-705 backend checks for echo
    over USB either way.
  sources:
  - S1
  - S7
  - S15
  confidence: high
software:
- app: fldigi
  setting: Rig control
  value: flrig (rig IC-705, CI-V A4h, PTT via CAT) or RigCAT with IC-705.xml
  note: Echo setting must match CI-V USB Echo Back [S7].
- app: fldigi
  setting: Audio devices
  value: USB Audio CODEC (the radio)
  note: The if00 USB interface carries audio [S7].
notes: |-
  Researched from Icom's IC-705 Basic and Advanced manuals (July 2020) and firmware information sheets up to V1.40, Adam Farson VA7OJ's test report and the QST review, plus the setup notes listed under Sources. Not yet confirmed on air by an openRMS user: check the step confidence. Written for firmware 1.20 or newer (PRESET menu, tone controls disabled in data mode) [S3].

  One micro-USB cable carries CI-V and audio [S4]. The radio shows two virtual COM ports, 'IC-705 Serial Port A (CI-V)' for rig control and 'IC-705 Serial Port B' [S2]; on Linux pick the /dev/serial/by-id entry ending in if00 [S7]. Windows needs Icom's USB driver; macOS and Linux don't [S7]. There is no CI-V USB Port or CI-V USB Baud Rate item on the IC-705 [S1]: QST found it ran at 9600 bps, BotanicFields sets WSJT-X to its maximum, and Hamlib's backend accepts 4800–19200 [S5] [S8] [S15]. Port B carries GPS data only when 'GPS Out' is set to USB (B) [S1].

  fldigi controls the IC-705 through flrig or through RigCAT with the IC-705.xml rig file; CW keying by CAT uses the Icom option with address A4 [S7]. No PSK-specific filter or power advice was found for the IC-705.

  AGC isn't set: sources disagree. BotanicFields changes the SLOW preset to OFF and runs FT8 with AGC off, and the WSJT-X guide suggests AGC off or reduced RF gain; Farson tested with AGC MID and advises backing off RF gain until OVF goes out [S8] [S16] [S4]. If you run AGC off, watch OVF.

  Power and duty cycle: the BP-272 pack (7.4 V, 1880 mAh) gives about 3 hours in Icom's FM test at a 1:1:8 transmit/receive/standby ratio, and output is capped at 5 W on it [S2] [S1]. QST expected a high-duty-cycle mode such as FT8 to shorten battery life [S5]. Farson found the case only warm after long full-power key-down tests [S4]; if the final amplifier overheats the radio reduces power and then inhibits transmit until it cools [S2]. The Time-Out Timer defaults to 5 minutes [S1].
