schema: openrms-rigs/profile/v1
title: IC-705 FT8 over Wi-Fi (wfview or RS-BA1)
summary: 'No cable to the computer: CAT and audio over the IC-705''s built-in WLAN through wfview, kappanhang
  or Icom''s RS-BA1. DATA MOD must be WLAN.'
rig:
  macro: RIG_MODEL_IC705
  hamlib_model: 3085
  mfg: Icom
  name: IC-705
  firmware: '>=1.20'
operation: ft8
connection: lan
interface: built-in WLAN (2.4 GHz) with wfview, kappanhang or RS-BA1
hamlib: '>=4.6'
audio:
  rx_target_dbfs: -25
  rx_note: About 30 dB on WSJT-X's meter with no signals present (WSJT-X guide [S16]).
  tx_note: 'No ALC: set drive with the remote app''s MOD slider and WSJT-X''s Pwr while watching ALC.'
steps:
- id: mode
  kind: mode
  name: MODE
  value: PKTUSB
  passband_hz: 3000
  note: USB-D. The IC-705 has a single data mode (LSB-D/USB-D/AM-D/FM-D), and Hamlib's PKTUSB sends data mode
    01 with it, which selects USB-D. Over WLAN, Hamlib reaches the radio through wfview's or kappanhang's rigctld
    emulation.
  sources:
  - S1
  - S9
  - S15
  confidence: high
- id: fil1
  kind: manual
  name: Filter FIL1 (USB-D)
  manual:
    menu: Filter icon (touch 1 s) > FIL1 > BW, then MAIN DIAL
    value: 3.0 kHz (SSB-D default); 3.6 kHz is the maximum
  note: SSB-D filters default to FIL1 3.0 kHz, FIL2 1.2 kHz, FIL3 500 Hz, so FIL1 already covers a sub-band.
    BotanicFields widens it to 3.6 kHz and sets WSJT-X's receive range to match.
  sources:
  - S1
  - S8
  confidence: high
- id: nb-off
  kind: func
  name: NB
  menu:
  - FUNCTION
  - NB
  value: false
  note: 'Off: Icom notes the noise blanker can distort received signals. No IC-705 source gives a digital-mode
    setting.'
  sources:
  - S1
  confidence: medium
- id: nr-off
  kind: func
  name: NR
  menu:
  - FUNCTION
  - NR
  value: false
  note: Off as a baseline (general digital-mode practice; S1 gives only the control).
  sources:
  - S1
  confidence: low
- id: wlan-type
  kind: manual
  name: WLAN connection type
  manual:
    menu: MENU » SET > WLAN Set > Connection Type
    value: Station (Connect to Network, default) or Access Point (Connect to Phone, PC)
  note: Station joins your network (Icom recommends a static address); Access Point lets one PC join the radio
    directly at the fixed address 192.168.59.1. In Access Point mode set a password first; WLAN turns itself
    off after 20 minutes without a client on battery.
  sources:
  - S1
  - S3
  - S10
  - S12
  confidence: high
- id: wlan-on
  kind: manual
  name: WLAN
  manual:
    menu: MENU » SET > WLAN Set > WLAN
    value: 'ON'
  sources:
  - S1
  - S10
  - S12
  confidence: high
- id: net-control
  kind: manual
  name: Network Control
  manual:
    menu: MENU » SET > WLAN Set > Remote Settings > Network Control
    value: ON (default OFF; valid after restart)
  note: Nothing can control the radio over the network until this is on and the radio restarted.
  sources:
  - S1
  - S14
  confidence: high
- id: net-ports
  kind: manual
  name: Control / Serial / Audio ports
  manual:
    menu: MENU » SET > WLAN Set > Remote Settings
    value: UDP 50001 / 50002 / 50003 (defaults)
  sources:
  - S1
  - S12
  - S14
  confidence: high
- id: net-user
  kind: manual
  name: Network User1 ID and password
  manual:
    menu: MENU » SET > WLAN Set > Remote Settings > Network User1
    value: your choice (password 8–16 characters); Administrator YES
  note: VK3FS made the user an administrator for RS-BA1. Don't expose the ports to the internet without a VPN.
  sources:
  - S1
  - S10
  confidence: medium
- id: wlan-af-sql
  kind: manual
  name: WLAN AF SQL
  manual:
    menu: MENU » SET > Connectors > WLAN AF/IF Output > AF SQL
    value: OFF (Open); the default is ON
  note: Unlike the USB output, network audio follows the squelch by default, so with the squelch closed the
    decoder hears nothing between signals.
  sources:
  - S1
  confidence: medium
- id: wlan-output
  kind: manual
  name: WLAN Output Select
  manual:
    menu: MENU » SET > Connectors > WLAN AF/IF Output > Output Select
    value: AF (default)
  sources:
  - S1
  - S3
  confidence: high
- id: wlan-mod
  kind: manual
  name: WLAN MOD Level
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > WLAN MOD Level
    value: 50% (default), then adjust for no ALC
  note: The wfview manual says to keep the gain for the selected MOD source at 50% or more, then watch its
    TxAudio meter (about -12 to -6 dBFS) and the ALC.
  sources:
  - S1
  - S13
  confidence: medium
- id: data-mod
  kind: manual
  name: DATA MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > DATA MOD
    value: WLAN (default USB)
  note: 'Required: with the USB default the radio ignores transmit audio from the network. kappanhang states
    WLAN; the wfview manual calls the network source ''LAN'' in its own settings. Set it back to USB for cabled
    operation.'
  sources:
  - S1
  - S13
  - S14
  confidence: high
- id: data-off-mod
  kind: manual
  name: DATA OFF MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > MOD Input > DATA OFF MOD
    value: MIC,USB (default); WLAN only for voice over the network
  note: FT8 runs in USB-D, so this only matters for voice modes. With USB or WLAN alone the mic and Voice TX
    memories stop working.
  sources:
  - S1
  - S13
  confidence: medium
- id: rf-power
  kind: level
  name: RFPOWER
  menu:
  - MULTI
  - RF POWER
  value: 0.5
  unit: fraction
  display: ~5 W
  safety: tx
  note: 50% of the 10 W scale. QST worked FT8 at 5 W and BotanicFields turns 10 W down to 5 W. RF POWER is
    limited by MAX TX PWR; read the Po meter on battery.
  sources:
  - S1
  - S5
  - S8
  confidence: medium
- id: max-tx-pwr
  kind: manual
  name: MAX TX PWR
  safety: tx
  manual:
    menu: FUNCTION > page 2 > MAX TX PWR
    value: 10 W on 13.8 V DC; 5 W is the ceiling on the battery pack
  note: Also kept per supply as Max TX Power (Battery Pack) and (DC 13.8 V) under MENU » SET > Function; 10
    W needs the external DC supply. With only the USB cable connected the battery still powers transmit, so
    a laptop's USB port doesn't lift the 5 W limit. Below about 0 °C battery protection drops output to 0.5
    W.
  sources:
  - S1
  - S4
  - S5
  confidence: high
- id: civ-address
  kind: manual
  name: CI-V Address
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V Address
    value: A4h (default)
  note: Use A4h with software that lists the IC-705 (Hamlib model 3085, fldigi/flrig). QST and OH8STN set 94h
    or picked the IC-7300 entry because WSJT-X and Winlink Express didn't list the IC-705 then; if you change
    the address, set the same one in every program.
  sources:
  - S1
  - S5
  - S6
  - S7
  - S15
  confidence: high
software:
- app: wfview
  setting: Radio connection
  value: network, the radio's IP address and Network User1 credentials
  note: '[S13] [S11]'
- app: wfview
  setting: External control
  value: Enable rigctld (port 4533 by default) or a virtual serial port
  note: The rigctld emulation accepts several programs at once; the virtual port only one [S13].
- app: wsjt-x
  setting: Radio > Rig
  value: Hamlib NET rigctl to localhost:4533 (wfview) or the virtual COM port (RS-BA1)
  note: '[S13] [S14] [S10]'
- app: wsjt-x
  setting: Audio > Input / Output
  value: the remote app's virtual audio devices
  note: VK3FS used VB-Audio cables with wfview and ICOM Virtual Audio with RS-BA1 [S11] [S10].
- app: rs-ba1
  setting: Remote Utility > Server
  value: the radio's IP address, control port 50001, Network User1
  note: Icom America and VK3FS (whose post prints the port as 5001) [S12] [S1] [S10].
notes: |-
  Researched from Icom's IC-705 Basic and Advanced manuals (July 2020) and firmware information sheets up to V1.40, Adam Farson VA7OJ's test report and the QST review, plus the setup notes listed under Sources. Not yet confirmed on air by an openRMS user: check the step confidence. Written for firmware 1.20 or newer (PRESET menu, tone controls disabled in data mode) [S3].

  The radio's Wi-Fi is 2.4 GHz only and won't join networks that need a sign-in page, so QST suggests a travel router away from home [S5]. Only one device can join the Access Point at a time, and the radio doesn't route to the internet in that mode [S3]. kappanhang expects the default ports, CI-V address A4h and the default FTTH 'Internet Access Line' [S14].

  Software paths: wfview logs in with Network User1 and offers a Hamlib rigctld emulation (port 4533 by default) and a virtual serial port; WSJT-X then uses 'Hamlib NET rigctl' or the virtual port, with virtual audio cables between wfview and WSJT-X (VK3FS used VB-Audio on Windows) [S13] [S11]. kappanhang offers the same two paths [S14]. RS-BA1 version 2 (version 1 lacks scope radios) creates a virtual COM port and 'ICOM Virtual Audio' devices [S10] [S12]. openRMS's Hamlib steps go through whichever rigctld emulation you run; wfview implements a subset of rigctld, so a step may report unknown.

  Bluetooth isn't a substitute: its serial profile carries CI-V and DV data only, and the audio profile is for headsets, so no source runs FT8 over it [S1] [S5].

  Power and duty cycle: the BP-272 pack (7.4 V, 1880 mAh) gives about 3 hours in Icom's FM test at a 1:1:8 transmit/receive/standby ratio, and output is capped at 5 W on it [S2] [S1]. QST expected a high-duty-cycle mode such as FT8 to shorten battery life [S5]. Farson found the case only warm after long full-power key-down tests [S4]; if the final amplifier overheats the radio reduces power and then inhibits transmit until it cools [S2]. The Time-Out Timer defaults to 5 minutes [S1].
