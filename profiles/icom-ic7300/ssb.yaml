schema: openrms-rigs/profile/v1
title: IC-7300 SSB phone with the stock HM-219 mic
summary: Mic gain and compression set the way Icom describes, with TBW and tone values from Farson VA7OJ's
  tested HM-219 setup.
rig:
  macro: RIG_MODEL_IC7300
  hamlib_model: 3073
  mfg: Icom
  name: IC-7300
  firmware: '>=1.40'
operation: ssb
connection: usb
interface: stock HM-219 hand mic
hamlib: '>=4.6'
audio:
  tx_note: With COMP off, set MIC GAIN so ALC reads 30–50% of its zone. With COMP on, the COMP meter should
    read 10–20 dB on voice peaks.
steps:
- id: mode
  kind: mode
  name: MODE
  check_only: true
  expect:
    one_of:
    - USB
    - LSB
  note: LSB below 10 MHz, USB above (band convention).
  sources:
  - S15
  confidence: high
- id: agc
  kind: level
  name: AGC
  value: 5
  display: MID
  note: MID. QST found SLOW (6 s) recovers very slowly on SSB. Icom suggests FAST for weak signals next
    to strong ones.
  sources:
  - S16
  confidence: medium
- id: mic-gain
  kind: level
  name: MICGAIN
  value: 0.5
  unit: fraction
  display: 50%
  safety: tx
  note: Start at 50%, then set so ALC reads 30–50% (Icom's procedure).
  sources:
  - S15
  - S18
  - S19
  confidence: medium
- id: comp-off
  kind: func
  name: COMP
  value: false
  safety: tx
  note: Off as a baseline; switch it on by hand when you want punch. Icom advises COMP off when driving
    an external amplifier, to avoid overshoot.
  sources:
  - S16
  confidence: medium
- id: nb-off
  kind: func
  name: NB
  value: false
  note: Off as a baseline. QST and Farson rate the noise blanker highly; defaults LEVEL 50%, DEPTH 8,
    WIDTH 50.
  sources:
  - S15
  - S1
  confidence: medium
- id: nr-off
  kind: func
  name: NR
  value: false
  note: Off as a baseline; Farson found level 6 a good working setting.
  sources:
  - S18
  confidence: low
- id: comp-level
  kind: manual
  name: COMP level
  safety: tx
  manual:
    menu: MULTI > COMP
    value: 5, then set by the COMP meter (10–20 dB)
  note: The Yamhill card starts at 2–3.
  sources:
  - S15
  - S18
  confidence: low
- id: tbw
  kind: manual
  name: TBW selection
  safety: tx
  manual:
    menu: FUNCTION > TBW
    value: WIDE for ragchew; MID or NAR for DX
  sources:
  - S18
  - S20
  confidence: low
- id: tbw-wide
  kind: manual
  name: TBW WIDE preset
  safety: tx
  manual:
    menu: MENU » SET > Tone Control/TBW > TX > SSB > TBW (WIDE)
    value: 200–2900 Hz (default 100–2900)
  note: 'Defaults: WIDE 100–2900, MID 300–2700, NAR 500–2500. Raising the low cut to 200 Hz suits the
    HM-219 (Farson, K0PIR).'
  sources:
  - S15
  - S1
  - S18
  - S20
  confidence: medium
- id: tx-tone
  kind: manual
  name: TX Bass / Treble (SSB)
  safety: tx
  manual:
    menu: MENU » SET > Tone Control/TBW > TX > SSB > Bass / Treble
    value: Bass 0, Treble +3 (HM-219)
  note: Farson's HM-219 setting. K0PIR uses -2/+4 with a different mic. Defaults 0/0.
  sources:
  - S18
  - S20
  confidence: low
- id: ip-plus
  kind: manual
  name: IP+
  manual:
    menu: FUNCTION > IP+
    value: OFF; on when strong signals or OVF show up
  note: IP+ trades sensitivity for intermodulation performance. Sherwood measured a large noise-floor
    cost on early units and about 1 dB on 2018 units.
  sources:
  - S16
  - S17
  - S18
  confidence: high
- id: preamp
  kind: manual
  name: Preamp
  manual:
    menu: P.AMP/ATT
    value: OFF on 7 MHz and below; P.AMP1 on higher HF; P.AMP2 mainly for 50 MHz
  note: Sherwood measured P.AMP1 at about 7 dB and P.AMP2 at about 11 dB. Icom calls P.AMP1 most effective
    on the HF low bands.
  sources:
  - S15
  - S16
  - S18
  confidence: medium
- id: monitor
  kind: manual
  name: Monitor
  manual:
    menu: FUNCTION > MONI
    value: set the level by ear on headphones
  sources:
  - S1
  confidence: low
notes: |-
  Researched from Icom's IC-7300 manuals, the QST review, lab reports by Rob Sherwood NC0B and Adam Farson VA7OJ, and operator articles listed under Sources. Many values are what a tester ran rather than a recommendation; check the step confidence. Not yet confirmed on air by an openRMS user. Menu paths follow firmware 1.30+ ('Tone Control/TBW') [S2].

  Desk mic: Farson ran a Heil PR-781 at 85% mic gain, COMP 8, Bass +1, Treble +5 [S18]. Those are one tester's settings, not a recommendation.
tags:
- researched
- unverified
