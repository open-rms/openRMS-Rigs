schema: openrms-rigs/profile/v1
title: IC-7300 FT8/FT4 over USB (WSJT-X)
summary: The classic single-cable IC-7300 digital setup, cross-checked across Icom's notes and the guides
  most operators actually follow.
rig:
  macro: RIG_MODEL_IC7300
  hamlib_model: 3073
  mfg: Icom
  name: IC-7300
  firmware: '>=1.40'
operation: ft8
connection: usb
interface: built-in USB codec
hamlib: '>=4.6'
audio:
  rx_target_dbfs: -25
  rx_note: About 30 dB on WSJT-X's meter with no signals present.
  tx_note: 'Keep ALC within its zone, ideally barely moving: lower WSJT-X''s Pwr slider until output just
    starts to drop.'
steps:
- id: mode
  kind: mode
  name: MODE
  value: PKTUSB
  passband_hz: 3000
  note: USB-D.
  sources:
  - S4
  - S5
  - S8
  - S10
  - S11
  - S14
  confidence: high
- id: agc
  kind: level
  name: AGC
  value: 2
  display: FAST
  note: FAST, with USB AF output around 40%. VK3FS runs AGC OFF with a much lower AF output (10–30%),
    and the WSJT-X guide says 'AGC off or reduce RF gain'. A TAPR test found AGC on costs FT8/WSPR little
    dynamic range.
  sources:
  - S8
  - S12
  confidence: medium
- id: nb-off
  kind: func
  name: NB
  value: false
  sources:
  - S4
  confidence: medium
- id: nr-off
  kind: func
  name: NR
  value: false
  sources:
  - S4
  confidence: medium
- id: usb-af
  kind: level
  name: USB_AF
  value: 0.4
  unit: fraction
  display: 40%
  expect:
    min: 0.1
    max: 0.6
  note: 'ACC/USB AF Output Level: the receive audio to the computer. 40% with AGC FAST; 10–30% if you
    run AGC OFF. Sources range widely (default 50%).'
  sources:
  - S4
  - S8
  confidence: medium
- id: data-mod
  kind: manual
  name: DATA MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > DATA MOD
    value: USB
  note: The default is ACC; it must change for USB audio.
  sources:
  - S1
  - S4
  - S5
  - S6
  - S7
  - S8
  - S10
  - S11
  confidence: high
- id: data-off-mod
  kind: manual
  name: DATA OFF MOD
  safety: tx
  manual:
    menu: MENU » SET > Connectors > DATA OFF MOD
    value: MIC,ACC (default)
  note: Leaves the mic working in voice modes. The fldigi wiki and The Stingy Ham use MIC.
  sources:
  - S1
  - S4
  - S5
  - S6
  - S7
  confidence: high
- id: usb-mod
  kind: manual
  name: USB MOD Level
  safety: tx
  manual:
    menu: MENU » SET > Connectors > USB MOD Level
    value: 40% to start, then adjust for minimal ALC
  note: Sources range from 28% to 50% (one uses 85%); the default is 50%. Set it with the ALC meter, not
    by number.
  sources:
  - S4
  - S5
  - S8
  confidence: medium
- id: output-select
  kind: manual
  name: ACC/USB Output Select
  manual:
    menu: MENU » SET > Connectors > ACC/USB Output Select
    value: AF
  sources:
  - S4
  - S5
  - S7
  - S8
  - S11
  confidence: high
- id: af-sql
  kind: manual
  name: ACC/USB AF SQL
  manual:
    menu: MENU » SET > Connectors > ACC/USB AF SQL
    value: OFF (OPEN)
  sources:
  - S4
  - S5
  - S7
  - S8
  - S11
  confidence: high
- id: af-beep
  kind: manual
  name: ACC/USB AF Beep/Speech Output
  manual:
    menu: MENU » SET > Connectors > ACC/USB AF Beep/Speech… Output
    value: 'OFF'
  note: Keeps beeps and voice announcements out of the decoder's audio.
  sources:
  - S4
  - S5
  - S7
  - S8
  - S11
  confidence: high
- id: usb-serial
  kind: manual
  name: USB Serial Function
  manual:
    menu: MENU » SET > Connectors > USB Serial Function
    value: CI-V
  sources:
  - S4
  - S7
  - S8
  confidence: high
- id: usb-send
  kind: manual
  name: USB SEND and USB Keying (CW/RTTY)
  manual:
    menu: MENU » SET > Connectors > USB SEND/Keying
    value: OFF, OFF, OFF
  note: PTT goes over CAT. Setting these to DTR or RTS can key the radio when the port opens, and the
    manual forbids assigning one line to two functions.
  sources:
  - S1
  - S4
  - S6
  - S7
  - S8
  confidence: high
- id: inhibit
  kind: manual
  name: Inhibit Timer at USB Connection
  manual:
    menu: MENU » SET > Connectors > USB SEND/Keying > Inhibit Timer at USB Connection
    value: ON (default)
  note: 'Icom: update the USB driver rather than turning this off.'
  sources:
  - S2
  - S4
  - S5
  - S7
  confidence: high
- id: civ-port
  kind: manual
  name: CI-V USB Port
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V USB Port
    value: Unlink from [REMOTE]
  note: 'Icom''s USB note: a linked port is limited to 19200 bps. Unlink is the default from firmware
    1.40. Two 2018 guides used Link.'
  sources:
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
  - S8
  confidence: high
- id: civ-baud
  kind: manual
  name: CI-V USB Baud Rate
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V USB Baud Rate
    value: 115200 (set the software to the same fixed rate)
  note: Takes effect only when the port is Unlinked. Several guides use 19200; don't use Auto in software.
  sources:
  - S4
  - S6
  - S7
  - S8
  confidence: medium
- id: civ-address
  kind: manual
  name: CI-V Address
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V Address
    value: 94h (default)
  sources:
  - S1
  - S4
  - S5
  - S8
  - S10
  - S11
  confidence: high
- id: civ-transceive
  kind: manual
  name: CI-V Transceive
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V Transceive
    value: 'OFF'
  note: VK3FS and the factory default use ON.
  sources:
  - S6
  - S8
  - S11
  confidence: medium
- id: civ-echo
  kind: manual
  name: CI-V USB Echo Back
  manual:
    menu: MENU » SET > Connectors > CI-V > CI-V USB Echo Back
    value: 'ON'
  note: Hamlib 4.7 detects echo either way; ON suits RigCat/fldigi and other tools [S13].
  sources:
  - S4
  - S6
  - S7
  - S8
  - S11
  confidence: high
- id: fil1
  kind: manual
  name: Filter FIL1 (USB-D)
  manual:
    menu: FILTER (touch the filter indicator)
    value: 3.0 kHz, SHARP
  note: VK3FS uses 3.6 kHz.
  sources:
  - S8
  - S10
  confidence: medium
- id: tbw-data
  kind: manual
  name: TX bandwidth (SSB-D)
  manual:
    menu: MENU » SET > Tone Control/TBW > TX > SSB-D > TBW
    value: 300–2700 Hz (default)
  note: No source tunes it. Tone Control is disabled in data mode from firmware 1.40.
  sources:
  - S2
  confidence: medium
software:
- app: wsjt-x
  setting: Radio > Rig
  value: Icom IC-7300, baud matching the radio, 8 data bits, 1 stop bit, no handshake, DTR/RTS blank
- app: wsjt-x
  setting: Radio > PTT method
  value: CAT
- app: wsjt-x
  setting: Radio > Mode
  value: Data/Pkt
- app: wsjt-x
  setting: Radio > Split operation
  value: Fake It
  note: Keeps transmit audio at 1500–2000 Hz in the cleanest part of the passband. VK3FS and AA4TE use
    None [S9] [S14].
- app: wsjt-x
  setting: Audio > Input / Output
  value: USB Audio CODEC (receive on the left channel)
notes: |-
  Researched from Icom's IC-7300 manual, firmware notes and USB application note, plus setup guides by VK3FS, AA4TE, VA3QT, the fldigi wiki and others listed under Sources. Not yet confirmed on air by an openRMS user: check the step confidence. Written for firmware 1.40 or newer (1.30 added the SSB-D TBW and the USB SEND/Keying screen; 1.40 made Unlink the CI-V USB default) [S2]. This is the original IC-7300; the IC-7300MK2 has different menus and CI-V address.

  RF power isn't set here: some run the radio at 100% and trim with WSJT-X's Pwr slider; the fldigi wiki runs 25–40 W [S4] [S8] [S9]. FT8 transmits for about 13 s at a time, so choose what your station sustains.
