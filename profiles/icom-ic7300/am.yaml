schema: openrms-rigs/profile/v1
title: IC-7300 AM phone
summary: AM within the radio's 25 W carrier limit, with Farson's preferred receive filter.
rig:
  macro: RIG_MODEL_IC7300
  hamlib_model: 3073
  mfg: Icom
  name: IC-7300
  firmware: '>=1.40'
operation: am
connection: usb
interface: stock HM-219 hand mic
hamlib: '>=4.6'
steps:
- id: mode
  kind: mode
  name: MODE
  value: AM
  passband_hz: 0
  sources:
  - S15
  confidence: high
- id: agc
  kind: level
  name: AGC
  value: 5
  display: MID
  note: MID, or FAST under selective fading.
  sources:
  - S18
  confidence: medium
- id: carrier
  kind: manual
  name: Carrier power
  safety: tx
  manual:
    menu: RF POWER
    value: 25 W maximum carrier (AM range 1–25 W)
  note: 'Kept as a menu step: how Hamlib''s RFPOWER fraction maps to AM carrier isn''t confirmed.'
  sources:
  - S15
  - S1
  - S16
  - S18
  confidence: high
- id: am-tone
  kind: manual
  name: AM TX Bass / Treble
  safety: tx
  manual:
    menu: MENU » SET > Tone Control/TBW > TX > AM > Bass / Treble
    value: 0 / 0 (default)
  sources:
  - S15
  confidence: high
- id: am-filter
  kind: manual
  name: Receive filter
  manual:
    menu: FILTER (FIL1/2/3 = 9 / 6 / 3 kHz)
    value: FIL2 6 kHz
  note: Farson found it smoother.
  sources:
  - S18
  confidence: low
- id: ip-plus
  kind: manual
  name: IP+
  manual:
    menu: FUNCTION > IP+
    value: OFF; on when strong signals or OVF show up
  note: IP+ trades sensitivity for intermodulation performance. Sherwood measured a large noise-floor
    cost on early units and about 1 dB on 2018 units.
  sources:
  - S16
  - S17
  - S18
  confidence: high
- id: preamp
  kind: manual
  name: Preamp
  manual:
    menu: P.AMP/ATT
    value: OFF on 7 MHz and below; P.AMP1 on higher HF; P.AMP2 mainly for 50 MHz
  note: Sherwood measured P.AMP1 at about 7 dB and P.AMP2 at about 11 dB. Icom calls P.AMP1 most effective
    on the HF low bands.
  sources:
  - S15
  - S16
  - S18
  confidence: medium
notes: |-
  Researched from Icom's IC-7300 manuals, the QST review, lab reports by Rob Sherwood NC0B and Adam Farson VA7OJ, and operator articles listed under Sources. Many values are what a tester ran rather than a recommendation; check the step confidence. Not yet confirmed on air by an openRMS user. Menu paths follow firmware 1.30+ ('Tone Control/TBW') [S2].

  TBW applies to SSB and SSB-D only, not AM [S15] [S1].
tags:
- researched
- unverified
sources:
- id: S1
  title: IC-7300 Full Manual (Advanced, edition 11a)
  author: Icom Inc.
  url: https://icomeurope.com/wp-content/uploads/2023/04/IC-7300_ENG_IM_Advanced_11a_web.pdf
  note: Also read via ManualsLib.
- id: S2
  title: IC-7300 firmware 1.30 and 1.40/1.41 information sheets
  author: Icom Inc.
  url: https://icomfrance.com/uploads/files/produit/not-IC-7300_ENG_FirmUpInfo-en.pdf
- id: S15
  title: IC-7300 Basic Manual (edition 10)
  author: Icom Inc.
  url: https://icomuk.co.uk/files/icom/PDF/productManual/IC-7300_ENG_BM_10.pdf
- id: S16
  title: 'QST Product Review: Icom IC-7300'
  author: Steve Ford WB8IMY and the ARRL Lab (QST)
  url: https://web.archive.org/web/20220117181737/https://www.classicinternational.eu/_clientfiles/info_extra/review-icom-ic-7300-qst-august%202016.pdf
  date: 2016-08
- id: S17
  title: 'Sherwood Engineering HF Test Results: IC-7300 (Rev D)'
