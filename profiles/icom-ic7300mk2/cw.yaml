schema: openrms-rigs/profile/v1
title: IC-7300MK2 CW keyer defaults
summary: Icom's documented CW keyer defaults for the MK2, as a known baseline to start from.
rig:
  macro: RIG_MODEL_IC7300MK2
  hamlib_model: 3094
  mfg: Icom
  name: IC-7300MK2
operation: cw
connection: usb
interface: paddle on the KEY jack
hamlib: '>=4.7'
steps:
- id: mode
  kind: mode
  name: MODE
  value: CW
  passband_hz: 0
  sources:
  - S1
  confidence: high
- id: key-type
  kind: manual
  name: Key type
  manual:
    menu: MENU » SET > CW-KEY Set > Key Type
    value: Paddle (default); Straight with an external keyer
  sources:
  - S1
  confidence: high
- id: polarity
  kind: manual
  name: Paddle polarity
  manual:
    menu: MENU » SET > CW-KEY Set > Paddle Polarity
    value: Normal (default)
  sources:
  - S1
  confidence: high
- id: ratio
  kind: manual
  name: Dot/dash ratio
  safety: tx
  manual:
    menu: MENU » SET > CW-KEY Set > Dot/Dash Ratio
    value: 1:1:3.0 (default)
  sources:
  - S1
  confidence: high
- id: rise
  kind: manual
  name: Rise time
  safety: tx
  manual:
    menu: MENU » SET > CW-KEY Set > Rise Time
    value: 4 ms (default)
  note: Shorter rise times cause key clicks.
  sources:
  - S1
  confidence: high
- id: sidetone
  kind: manual
  name: Side tone level
  manual:
    menu: MENU » SET > CW-KEY Set > Side Tone Level
    value: 50% (default)
  sources:
  - S1
  confidence: high
- id: break-in
  kind: manual
  name: Break-in
  manual:
    menu: VOX/BK-IN key
    value: BKIN (semi break-in) for general use
  note: Profiles never switch break-in automatically. Set it on the radio when you're ready to transmit.
  sources:
  - S1
  - S2
  confidence: low
notes: |-
  Researched from Icom's MK2 manuals and community reports, not yet confirmed on air by an openRMS user. The MK2 is not an IC-7300 with new paint: its CI-V address is B6h (the IC-7300 uses 94h), several IC-7300 menu items such as CI-V USB Baud Rate and USB Serial Function no longer exist, and some CI-V commands moved [S6] [S7]. Hamlib lists it as model 3094 (Beta); pick the IC-7300MK2 entry, never IC-7300.

  CW pitch (300–900 Hz) and keyer speed (6–48 WPM) are personal choices; no MK2 source recommends values.
tags:
- researched
- unverified
